name: Lectern
options:
  bundleIdPrefix: com.advait
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LecternKit:
    path: Packages/LecternKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Lectern:
    type: application
    platform: macOS
    sources:
      - path: App/Lectern
      - path: App/Resources
        optional: true
    dependencies:
      - package: LecternKit
        product: LecternCore
      - package: LecternKit
        product: LecternTranscription
      - package: LecternKit
        product: LecternLLM
      - package: LecternKit
        product: LecternMLX
      - package: LecternKit
        product: LecternSlides
      - package: LecternKit
        product: LecternStore
      - package: LecternKit
        product: LecternIntelligence
      - package: LecternKit
        product: LecternImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advait.Lectern
        PRODUCT_NAME: Lectern
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lectern
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lectern listens to your lecture to write a live transcript. Audio never leaves your Mac."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Lectern uses on-device speech recognition to transcribe your lecture."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Lectern asks Keynote or PowerPoint to convert your slides to PDF. Nothing else is controlled."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
